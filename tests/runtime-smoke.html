<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PENDING</title>
  <style>
    body { margin: 20px; }
    #rich { width: 240px; text-align: left; }
    #button { width: 120px; height: 20px; white-space: nowrap; }
    #spacer { height: 1800px; }
  </style>
</head>
<body>
  <p id="rich">You see <b>a beautiful woman</b> near the door.</p>
  <button id="button">A very short button</button>
  <p id="legacy">Legacy line</p>
  <div id="spacer"></div>
  <p id="later">A later paragraph appears after scrolling.</p>
  <pre id="result" data-coc2-private>PENDING</pre>
  <script>
    (function () {
      localStorage.removeItem("coc2-translator.settings.v2");
      localStorage.setItem("coc2-translator.cache-meta.v1", JSON.stringify({ version: 1, records: 99, bytes: 99, languages: { ar: { records: 99, bytes: 99 } } }));
      localStorage.setItem("coc2-translator.cache-meta-dirty.v1", "1");
      function request(result) {
        let success = null;
        const value = { result, error: null };
        Object.defineProperty(value, "onsuccess", {
          configurable: true,
          get() { return success; },
          set(callback) { success = callback; if (callback) setTimeout(callback, 0); }
        });
        return value;
      }
      const cache = new Map();
      cache.set("v1\nar\n811c9dc5\nLegacy line", "سطر قديم");
      window.smokeCache = cache;
      const transaction = () => {
        let complete = null;
        const value = { objectStore: () => store };
        Object.defineProperty(value, "oncomplete", {
          configurable: true,
          get() { return complete; },
          set(callback) { complete = callback; if (callback) setTimeout(callback, 0); }
        });
        return value;
      };
      const store = {
        get: (key) => request(cache.get(key)),
        put: (value, key) => { cache.set(key, value); return request(undefined); },
        delete: (key) => { cache.delete(key); return request(undefined); },
        openCursor: () => {
          const entries = Array.from(cache.entries()).sort(([left], [right]) => left.localeCompare(right));
          const cursorRequest = { result: null, error: null };
          let index = 0;
          let success = null;
          const advance = () => {
            cursorRequest.result = index < entries.length ? {
              key: entries[index][0], value: entries[index][1],
              continue() { index += 1; setTimeout(advance, 0); }
            } : null;
            if (success) success();
          };
          Object.defineProperty(cursorRequest, "onsuccess", {
            configurable: true,
            get() { return success; },
            set(callback) { success = callback; if (callback) setTimeout(advance, 0); }
          });
          return cursorRequest;
        },
        clear: () => { cache.clear(); return request(undefined); },
        count: () => request(cache.size),
        getAllKeys: (range, limit) => request(range ? [] : Array.from(cache.keys()).sort().slice(0, limit)),
        getAll: (range, limit) => request(range ? [] : Array.from(cache.keys()).sort().slice(0, limit).map((key) => cache.get(key)))
      };
      const database = { transaction };
      Object.defineProperty(window, "indexedDB", { value: { open: () => request(database) } });
      window.smokeIntersectionObservers = [];
      class SmokeIntersectionObserver {
        constructor(callback) {
          this.callback = callback;
          this.targets = new Set();
          window.smokeIntersectionObservers.push(this);
        }
        observe(target) { this.targets.add(target); }
        unobserve(target) { this.targets.delete(target); }
        disconnect() { this.targets.clear(); }
        trigger() {
          this.callback(Array.from(this.targets, (target) => ({ target, isIntersecting: true })), this);
        }
      }
      Object.defineProperty(window, "IntersectionObserver", { configurable: true, value: SmokeIntersectionObserver });
      window.__vnRevivalLocalBridge = { baseURL: "http://127.0.0.1:9999", token: "smoke-test-token-1234" };
      window.confirm = () => true;
    })();
    window.fetchCalls = [];
    window.localHelperCalls = [];
    window.fetch = async function (input) {
      const url = new URL(String(input));
      if (url.hostname === "127.0.0.1") {
        window.localHelperCalls.push(url.pathname);
        if (url.pathname === "/v1/openai-compatible/status") {
          return { ok: true, json: async () => ({
            ok: true, configured: false, available: false, requiresKey: true,
            preset: "opencode-go", name: "OpenCode Go",
            baseURL: "https://opencode.ai/zen/go/v1", models: ["test/model"],
            message: "Add the OpenCode Go API key first",
            credentialStorage: "test credential vault", promptVersion: "vnrevival-openai-compatible-v1"
          }) };
        }
        return { ok: true, json: async () => ({ ok: true, reselectOnNextLaunch: true }) };
      }
      const source = url.searchParams.get("q") || "";
      window.fetchCalls.push(source);
      const translated = source.includes("VRCTXSEP1X")
        ? "ترى VRCTXSEP1X امرأة جميلة VRCTXSEP2X بالقرب من الباب."
        : source === "A very short button"
        ? "زر طويل جداً لاختبار التفاف النص داخل الواجهة"
        : "ترجمة";
      return { ok: true, json: async () => [[[translated, source]]] };
    };
  </script>
  <script src="../src/translation-core.js?v=0.10.2"></script>
  <script src="../src/languages.js?v=0.10.2"></script>
  <script src="../src/providers.js?v=0.10.2"></script>
  <script src="../.build/game-config.js?v=0.10.2"></script>
  <script src="../src/games/coc2/adapter.js?v=0.10.2"></script>
  <script src="../src/translator-runtime.js?v=0.10.2"></script>
  <script>
    (async function () {
      window.scrollTo(0, 0);
      await new Promise((resolve) => requestAnimationFrame(() => resolve()));
      const host = document.getElementById("vnrevival-translator-coc2");
      const shadow = host.shadowRoot;
      const defaultLanguage = shadow.querySelector(".language").value;
      const autoCheckbox = shadow.querySelector(".auto");
      const defaultAutoTranslate = autoCheckbox.checked === true
        && window.__vnRevivalTranslator.settings().autoTranslate === true;
      const languageOptions = Array.from(shadow.querySelector(".language").options)
        .map((option) => [option.value, option.textContent]);
      const languageIsTopLevel = !!shadow.querySelector(".panel > .quickLanguage > .language")
        && !shadow.querySelector(".settings .language")
        && shadow.querySelector(".quickLanguage").nextElementSibling?.classList.contains("row")
        && getComputedStyle(shadow.querySelector(".quickLanguage")).display !== "none";
      const providerOptions = Array.from(shadow.querySelector(".provider").options)
        .map((option) => [option.value, option.textContent]);
      const shortcutInsideMainButton = shadow.querySelector(".translate .translateShortcut")?.textContent === "Ctrl+Shift+T"
        && shadow.querySelector(".translate .translateAction")?.textContent === "Translate"
        && shadow.querySelector(".translate")?.getAttribute("aria-label") === "Translate (Ctrl+Shift+T)"
        && !shadow.querySelector(".hotkey");
      const openAIKeyIsPasswordOnly = shadow.querySelector(".openAICompatibleKey").type === "password"
        && !Object.keys(localStorage).some((key) => /api.*key/i.test(key));
      shadow.querySelector(".provider").value = "openai-compatible";
      shadow.querySelector(".provider").dispatchEvent(new Event("change"));
      await new Promise((resolve) => setTimeout(resolve, 30));
      const openAISetupVisible = !shadow.querySelector(".openAICompatibleBox").hidden
        && shadow.querySelector(".openAICompatibleStatus").textContent.includes("OpenCode Go")
        && !shadow.querySelector(".openAICompatibleSave").disabled
        && shadow.querySelector(".openAICompatiblePreset").options.length === 6;
      shadow.querySelector(".language").value = "ar";
      shadow.querySelector(".language").dispatchEvent(new Event("change"));
      shadow.querySelector(".provider").value = "google";
      shadow.querySelector(".provider").dispatchEvent(new Event("change"));
      const googleHintRemoved = shadow.querySelector(".providerHint").textContent === ""
        && getComputedStyle(shadow.querySelector(".providerHint")).display === "none";
      const organicAutoToggle = autoCheckbox.closest(".autoToggle")
        && autoCheckbox.getAttribute("aria-label") === "Automatically translate new screens"
        && !!shadow.querySelector(".autoCopy .autoTitle")
        && !!shadow.querySelector(".autoTrack .autoThumb");
      autoCheckbox.closest(".autoToggle").click();
      const savedAfterAutoChange = JSON.parse(localStorage.getItem("coc2-translator.settings.v2") || "null");
      const autoChangeSaved = savedAfterAutoChange && savedAfterAutoChange.autoTranslate === false;
      shadow.querySelector(".allowAuto").click();
      const autosavedSettings = JSON.parse(localStorage.getItem("coc2-translator.settings.v2") || "null");
      const removedSettingsButtons = !shadow.querySelector(
        ".cacheActions,.launcherActions,.settingsActions,.save,.reset,.clearLanguage,.export,.import,.changeExecutable"
      );
      const removedBottomHint = !shadow.querySelector(".hint");
      const collapseButton = shadow.querySelector(".collapseToggle");
      collapseButton.click();
      const collapsedStateSaved = shadow.querySelector(".panel").classList.contains("collapsed")
        && JSON.parse(localStorage.getItem("coc2-translator.settings.v2") || "null").collapsed === true
        && collapseButton.textContent === "+";
      collapseButton.click();
      const expandedStateSaved = !shadow.querySelector(".panel").classList.contains("collapsed")
        && JSON.parse(localStorage.getItem("coc2-translator.settings.v2") || "null").collapsed === false
        && collapseButton.textContent === "−";
      const contactLinksPresent = shadow.querySelector('.contactIcon.discord')?.href === "https://discord.gg/QgyeWW3Jg"
        && shadow.querySelector('.contactIcon.telegram')?.href === "https://t.me/VnRevival"
        && shadow.querySelector('.contactIcon.email')?.getAttribute("href") === "mailto:master1c8@proton.me";
      window.__vnRevivalTranslator.showTranslations();
      const translationPromise = Promise.resolve(window.__vnRevivalTranslator.translateScreen());
      const cancelStateKeepsShortcut = shadow.querySelector(".translate .translateAction")?.textContent === "Cancel"
        && shadow.querySelector(".translate .translateShortcut")?.textContent === "Ctrl+Shift+T"
        && shadow.querySelector(".translate")?.getAttribute("aria-label") === "Cancel (Ctrl+Shift+T)";
      const outcome = await Promise.race([
        translationPromise.then(() => "completed"),
        new Promise((resolve) => setTimeout(() => resolve("timeout"), 1500))
      ]);

      const rich = document.getElementById("rich");
      const button = document.getElementById("button");
      const legacy = document.getElementById("legacy");
      const translated = {
        text: rich.textContent.replace(/\s+/g, " ").trim(),
        direction: rich.getAttribute("dir"),
        language: rich.getAttribute("lang"),
        bidi: rich.style.getPropertyValue("unicode-bidi"),
        lineHeight: rich.style.getPropertyValue("line-height"),
        fontFamily: rich.style.getPropertyValue("font-family"),
        buttonHeight: button.style.getPropertyValue("height"),
        buttonWrap: button.style.getPropertyValue("white-space")
      };
      const legacyMigrated = legacy.textContent.trim() === "سطر قديم"
        && !window.fetchCalls.includes("Legacy line")
        && !window.smokeCache.has("v1\nar\n811c9dc5\nLegacy line")
        && window.smokeCache.get("v3\ncoc2\ngoogle\nar\nLegacy line") === "سطر قديم";

      const later = document.getElementById("later");
      later.scrollIntoView();
      window.smokeIntersectionObservers.forEach((observer) => observer.trigger());
      for (let attempt = 0; attempt < 100 && later.textContent.trim() !== "ترجمة"; attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 20));
      }
      const scrolledTranslation = later.textContent.trim();

      await new Promise((resolve) => setTimeout(resolve, 700));
      const repairedMetadata = JSON.parse(localStorage.getItem("coc2-translator.cache-meta.v1") || "null");
      const metadataDirty = localStorage.getItem("coc2-translator.cache-meta-dirty.v1");
      const cacheBox = shadow.querySelector(".cacheBox");
      const cacheDeleteButton = shadow.querySelector(".cacheDelete");
      const compactCacheRow = getComputedStyle(cacheBox).display === "flex"
        && cacheBox.children.length === 2
        && /^Cache: \d+(?:\.\d+)? (?:B|KB|MB)$/.test(shadow.querySelector(".cacheStats").textContent)
        && cacheDeleteButton.textContent === "Delete";
      cacheDeleteButton.click();
      for (let attempt = 0; attempt < 50 && shadow.querySelector(".cacheStats").textContent !== "Cache: 0 B"; attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 20));
      }
      const cacheDeleted = window.smokeCache.size === 0
        && shadow.querySelector(".cacheStats").textContent === "Cache: 0 B"
        && cacheDeleteButton.disabled === false;

      const legacyGlobalsScopedToCoC2 = window.CoC2TranslationCore === window.VNRevivalTranslationCore
        && window.CoC2TranslatorLanguages === window.VNRevivalTranslatorLanguages
        && window.__coc2Translator === window.__vnRevivalTranslator;

      window.__vnRevivalTranslator.showOriginal();
      const restored = {
        text: rich.textContent.replace(/\s+/g, " ").trim(),
        direction: rich.hasAttribute("dir"),
        language: rich.hasAttribute("lang"),
        textAlign: rich.style.getPropertyValue("text-align"),
        fontFamily: rich.style.getPropertyValue("font-family"),
        buttonHeight: button.style.getPropertyValue("height"),
        buttonWrap: button.style.getPropertyValue("white-space")
      };

      const passed = translated.text === "ترى امرأة جميلة بالقرب من الباب."
        && translated.direction === "rtl"
        && translated.language === "ar"
        && translated.bidi === "plaintext"
        && translated.lineHeight === "1.35"
        && translated.fontFamily.includes("Noto Sans Arabic")
        && translated.buttonHeight === "auto"
        && translated.buttonWrap === "normal"
        && scrolledTranslation === "ترجمة"
        && repairedMetadata.records === 4
        && compactCacheRow
        && cacheDeleted
        && metadataDirty === null
        && legacyMigrated
        && legacyGlobalsScopedToCoC2
        && shortcutInsideMainButton
        && cancelStateKeepsShortcut
        && defaultLanguage === "en"
        && defaultAutoTranslate
        && languageIsTopLevel
        && languageOptions.length === 30
        && JSON.stringify(languageOptions.slice(0, 2)) === JSON.stringify([
          ["zh", "Chinese (Simplified) (中文（简体）)"],
          ["en", "English"]
        ])
        && JSON.stringify(languageOptions.at(-1)) === JSON.stringify(["he", "Hebrew (עברית)"])
        && JSON.stringify(providerOptions) === JSON.stringify([["google", "Google Translate"], ["openai-compatible", "OpenAI-compatible"]])
        && openAIKeyIsPasswordOnly
        && openAISetupVisible
        && googleHintRemoved
        && organicAutoToggle
        && autoChangeSaved
        && autosavedSettings.language === "ar"
        && autosavedSettings.provider === "google"
        && autosavedSettings.autoTranslate === true
        && removedSettingsButtons
        && removedBottomHint
        && collapsedStateSaved
        && expandedStateSaved
        && contactLinksPresent
        && restored.text === "You see a beautiful woman near the door."
        && restored.direction === false
        && restored.language === false
        && restored.textAlign === ""
        && restored.fontFamily === ""
        && restored.buttonHeight === ""
        && restored.buttonWrap === "";
      document.getElementById("result").textContent = JSON.stringify({
        passed,
        outcome,
        settings: window.__vnRevivalTranslator.settings(),
        fetchCalls: window.fetchCalls,
        scrolledTranslation,
        repairedMetadata,
        compactCacheRow,
        cacheDeleted,
        metadataDirty,
        legacyMigrated,
        legacyGlobalsScopedToCoC2,
        shortcutInsideMainButton,
        cancelStateKeepsShortcut,
        defaultLanguage,
        defaultAutoTranslate,
        languageIsTopLevel,
        languageOptions,
        providerOptions,
        openAIKeyIsPasswordOnly,
        openAISetupVisible,
        googleHintRemoved,
        organicAutoToggle,
        autoChangeSaved,
        autosavedSettings,
        removedSettingsButtons,
        removedBottomHint,
        collapsedStateSaved,
        expandedStateSaved,
        contactLinksPresent,
        translated,
        restored
      });
      document.title = passed ? "PASS" : "FAIL";
    })();
  </script>
</body>
</html>
